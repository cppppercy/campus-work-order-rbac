name: Java 17 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        shell: bash
        run: ./mvnw --batch-mode clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: campus-rbac-${{ matrix.os }}
          path: |
            target/campus-work-order-rbac.jar
            target/surefire-reports/
